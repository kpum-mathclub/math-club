<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Contact | 京都府立医科大学 数学研究部</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">

  <!-- p5.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>

  <style>
    /* ===== index と同じテーマ変数 ===== */
    :root{
      --bg:#0b0d12; --fg:#e7e9ee; --muted:#9aa3af;
      --accent:#54d6a3; --accent-2:#5da8ff;
      --glass:rgba(255,255,255,.08); --border:rgba(255,255,255,.18);
      --shadow:0 10px 30px rgba(0,0,0,.35); --card-radius:18px;
      --focus:0 0 0 3px rgba(93,168,255,.35);
    }
    [data-theme="light"]{
      --bg:#f7f8fb; --fg:#0c111a; --muted:#4b5563;
      --accent:#1ea972; --accent-2:#2f7cff;
      --glass:rgba(255,255,255,.7); --border:rgba(17,24,39,.08);
      --shadow:0 10px 30px rgba(0,0,0,.08);
      --focus:0 0 0 3px rgba(47,124,255,.25);
    }

    *{ box-sizing:border-box }
    html,body{ height:100% }
    html, body{
      margin:0; padding:0; overflow-x:hidden;
      background:var(--bg); color:var(--fg);
      font-family:"Inter", system-ui, -apple-system, "Noto Serif JP", serif;
      -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
      overscroll-behavior: none;
    }
    a{ color:inherit; text-decoration:none }
    a:focus-visible, button:focus-visible{ outline:none; box-shadow:var(--focus); border-radius:10px }

    /* 背景（下層） */
    .bg-gradient{
      position:fixed; inset:0; z-index:0;
      background:
        radial-gradient(1000px 600px at 15% 20%, rgba(84,214,163,.25), transparent 60%),
        radial-gradient(900px 700px at 85% 70%, rgba(93,168,255,.22), transparent 55%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg) 100%);
    }
    #bg-canvas{ position:fixed; inset:0; z-index:2; pointer-events:none; }

    /* ===== UIレイヤー（上層にまとめる：indexと同じ） ===== */
    #ui-layer{ position:relative; z-index:10; }

    /* 固定ナビ（indexと同一） */
    nav{
      position:fixed; top:0; left:0; right:0; z-index:11;
      backdrop-filter: blur(12px);
      background: linear-gradient(180deg, rgba(0,0,0,.35), rgba(0,0,0,.10)), var(--glass);
      border-bottom:1px solid var(--border);
      box-shadow: var(--shadow);
    }
    .nav-inner{
      max-width:1100px; margin:0 auto;
      display:flex; align-items:center; gap:20px; padding:14px 24px;
    }
    .brand{
      display:flex; align-items:center; gap:12px;
      font-weight:700; letter-spacing:.02em; font-family:"Noto Serif JP", serif;
    }
    .brand-badge{
      display:inline-grid; place-items:center;
      width:34px; height:34px; border-radius:10px;
      background:linear-gradient(135deg, var(--accent), var(--accent-2));
      color:#fff; font-weight:800; box-shadow:0 6px 18px rgba(0,0,0,.25);
    }
    .nav-links{
      margin-left:auto; display:flex; gap:18px; flex-wrap:wrap; align-items:center;
    }
    .nav-links a{
      padding:8px 10px; border-radius:10px; opacity:.95;
      transition: color .15s ease, background .15s ease, text-shadow .15s ease, border-color .15s ease;
    }
    .nav-links a:hover{
      color:var(--accent); background:rgba(94,241,255,.08);
      text-shadow:0 0 10px rgba(94,241,255,.5);
    }
    .nav-links a.active{
      color:var(--accent);
      text-shadow:0 0 10px rgba(94,241,255,.6);
      background:rgba(94,241,255,.10);
      border:1px solid rgba(94,241,255,.22);
    }
    .theme-toggle{
      margin-left:6px; border:1px solid var(--border); background:var(--glass);
      border-radius:12px; padding:8px 12px; cursor:pointer; box-shadow:var(--shadow); font-weight:600;
    }
    .difficulty{
      display:flex; gap:10px; align-items:center; padding:8px 12px; border-radius:12px;
      background:var(--glass); border:1px solid var(--border); box-shadow:var(--shadow);
      font-size:13px;
    }
    .difficulty input[type="range"]{ width:160px; accent-color: var(--accent-2); }

    /* コンテンツ */
    main{ padding-top:86px; }
    .container{ max-width:1100px; margin:0 auto; padding:28px 24px 64px; }
    h1{
      font-size:28px; margin:0 0 24px;
      border-bottom:2px solid var(--accent); display:inline-block; padding-bottom:6px;
      font-family:"Noto Serif JP", serif;
    }
    .panel{
      margin: 24px 0; padding: 20px;
      border-left: 4px solid var(--accent);
      background-color: rgba(255,255,255,0.04);
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
      border-radius: 8px; border:1px solid var(--border);
    }
    .panel a{ color:var(--accent); font-weight:700; text-decoration:none; }
    .panel a:hover{ text-decoration:underline; }

    footer{ margin-top:36px; padding:18px; text-align:center; color:var(--muted); font-size:13px; }
  </style>
</head>

<body>
  <!-- 下層背景 -->
  <div class="bg-gradient"></div>
  <div id="bg-canvas" aria-hidden="true"></div>

  <!-- 上層UI（ここに nav と main をまとめる） -->
  <div id="ui-layer">
    <!-- ナビ（indexと同一） -->
    <nav>
      <div class="nav-inner">
        <div class="brand">
          <div class="brand-badge">∑</div>
          <div>京都府立医科大学 数学研究部</div>
        </div>

        <div class="nav-links" role="navigation" aria-label="Main">
          <a href="index.html">Home</a>
          <a href="activity.html">活動報告</a>
          <a href="schedule.html">Schedule</a>
          <a href="contact.html" class="active">Contact</a>
          <a href="#" id="openBooks">蔵書</a>
          <a href="qa.html">Q&amp;A</a>

          <!-- Difficulty（Home互換：他ページではno-opでもOK） -->
          <div class="difficulty" title="黒点（Walker）の数">
            <span>Difficulty</span>
            <input id="walkerRange" type="range" min="50" max="600" step="10" />
            <span id="walkerValue"></span>
            <button id="applyWalker" class="theme-toggle" style="padding:6px 10px;">Apply</button>
          </div>

          <button class="theme-toggle" onclick="toggleTheme()">Theme</button>
        </div>
      </div>
    </nav>

    <main>
      <div class="container">
        <h1>お問い合わせ・SNS</h1>

        <!-- 元の連絡先：X -->
        <section class="panel">
          <h2 style="margin:0 0 8px; font-family:'Noto Serif JP',serif;">公式X（旧Twitter）</h2>
          <p style="margin:0;">
            最新情報や活動報告を、京都府立医科大学 数学研究部の公式アカウントで発信しています。<br/>
            ▶ <a href="https://twitter.com/kpum_mathclub" target="_blank" rel="noopener">@kpum_mathclub</a>
          </p>
        </section>

        <!-- 元の連絡先：メール -->
        <section class="panel">
          <h2 style="margin:0 0 8px; font-family:'Noto Serif JP',serif;">メールでのお問い合わせ</h2>
          <p style="margin:0;">
            ご質問・連絡などは以下のアドレスまでご連絡ください：<br/>
            ▶ <a href="mailto:mb221010@stu.kpu-m.ac.jp">mb221010@stu.kpu-m.ac.jp</a>
          </p>
        </section>

        <footer>© Kyoto Prefectural University of Medicine Math Club Established in 2024</footer>
      </div>
    </main>
  </div>

  <!-- ===== Theme切替（indexと同じ） & Difficulty（Home互換） ===== -->
  <script>
    (function(){
      const saved = localStorage.getItem('theme');
      if(saved) document.documentElement.setAttribute('data-theme', saved);
      window.toggleTheme = function(){
        const root = document.documentElement;
        const next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
        root.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
      }
    })();

    (function(){ // Difficultyスライダー：Homeがある時だけ反映
      const DEFAULT_WALKERS = parseInt(localStorage.getItem('walkerCount') || '300', 10);
      const range = document.getElementById('walkerRange');
      const val = document.getElementById('walkerValue');
      const apply = document.getElementById('applyWalker');
      range.value = DEFAULT_WALKERS;
      val.textContent = DEFAULT_WALKERS;
      range.addEventListener('input', ()=> val.textContent = range.value);
      apply.addEventListener('click', ()=>{
        const n = parseInt(range.value,10);
        localStorage.setItem('walkerCount', String(n));
        if (window.__setWalkerCount) window.__setWalkerCount(n); // Home側のみ反応
      });
    })();

    // 「蔵書」：Homeにモーダルがあれば開く／無ければHomeへ
    (function(){
      const btn = document.getElementById('openBooks');
      if(!btn) return;
      btn.addEventListener('click', (e)=>{
        e.preventDefault();
        if (typeof window.__openBooksModal === 'function') {
          window.__openBooksModal();
        } else {
          location.href = 'index.html#books';
        }
      });
    })();
  </script>

  <!-- ===== 背景：バウンドする球 ===== -->
  <script>
    new p5(p => {
      const ballCount = 40;
      const balls = [];
      let isPressing = false;

      class Ball {
        constructor() {
          this.r = p.random(10, 30);
          this.x = p.random(this.r, p.windowWidth - this.r);
          this.y = p.random(this.r, p.windowHeight - this.r);
          this.vx = p.random(-1, 1);
          this.vy = p.random(-1, 1);
          this.color = p.color(p.random(150, 200), p.random(150, 200), p.random(255), 150);
        }
        move() {
          const speed = isPressing ? 3 : 1;
          this.x += this.vx * speed;
          this.y += this.vy * speed;
          if (this.x - this.r < 0) { this.x = this.r; this.vx *= -1; }
          if (this.x + this.r > p.width) { this.x = p.width - this.r; this.vx *= -1; }
          if (this.y - this.r < 0) { this.y = this.r; this.vy *= -1; }
          if (this.y + this.r > p.height) { this.y = p.height - this.r; this.vy *= -1; }
        }
        draw() { p.noStroke(); p.fill(this.color); p.ellipse(this.x, this.y, this.r * 2); }
      }

      p.setup = () => {
        const cnv = p.createCanvas(p.windowWidth, p.windowHeight);
        cnv.parent('bg-canvas');            // 背景レイヤー
        cnv.style('z-index', '2');
        cnv.style('pointer-events', 'none');
        for (let i = 0; i < ballCount; i++) balls.push(new Ball());
      };

      p.draw = () => { p.clear(); for (const b of balls){ b.move(); b.draw(); } };
      p.windowResized = () => { p.resizeCanvas(p.windowWidth, p.windowHeight); };
      p.mousePressed = () => { isPressing = true; };
      p.mouseReleased = () => { isPressing = false; };
      p.touchStarted = () => { isPressing = true; };
      p.touchEnded = () => { isPressing = false; };
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Contact | 数学研究部</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">

  <!-- p5.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>

  <style>
    :root{
      --bg:#0a0a0d; --fg:#eaeaea; --muted:#a4acb8;
      --accent:#5ef1ff; --accent2:#8a63ff;
      --glass:rgba(255,255,255,.08); --border:rgba(255,255,255,.18);
      --shadow:0 10px 30px rgba(0,0,0,.35);
    }

    body {
      font-family: "Inter", system-ui, -apple-system, "Noto Serif JP", serif;
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at 50% 20%, #0a0a0d 0%, #000 100%);
      color: var(--fg);
      overflow-x: hidden;
    }

    /* ▼ 統一ヘッダー（固定ナビ） */
    nav{
      position:fixed; top:0; left:0; right:0; z-index:1000;
      backdrop-filter: blur(12px);
      background: linear-gradient(180deg, rgba(0,0,0,.35), rgba(0,0,0,.10)), var(--glass);
      border-bottom:1px solid var(--border);
      box-shadow: var(--shadow);
    }
    .nav-inner{
      max-width:1100px; margin:0 auto;
      display:flex; align-items:center; gap:20px; padding:14px 24px;
    }
    .brand{
      display:flex; align-items:center; gap:12px;
      font-weight:700; letter-spacing:.02em; font-family:"Noto Serif JP", serif;
    }
    .brand-badge{
      display:inline-grid; place-items:center;
      width:34px; height:34px; border-radius:10px;
      background:linear-gradient(135deg, var(--accent), var(--accent2));
      color:#0a0f1a; font-weight:800;
      box-shadow:0 6px 18px rgba(0,0,0,.25);
    }
    .nav-links{
      margin-left:auto; display:flex; gap:18px; flex-wrap:wrap; align-items:center;
    }
    .nav-links a{
      color:#ddebff; text-decoration:none; padding:8px 10px; border-radius:10px; line-height:1;
      transition: color .15s ease, background .15s ease, text-shadow .15s ease, border-color .15s ease;
    }
    .nav-links a:hover{
      color:var(--accent);
      background:rgba(94,241,255,.08);
      text-shadow:0 0 10px rgba(94,241,255,.5);
    }
    .nav-links a.active{
      color:var(--accent);
      text-shadow:0 0 10px rgba(94,241,255,.6);
      background:rgba(94,241,255,.10);
      border:1px solid rgba(94,241,255,.22);
    }

    .container {
      padding: 100px 20px 40px; /* 上は固定ナビ分の余白を確保 */
      max-width: 800px;
      margin: 0 auto;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 24px;
      border-bottom: 2px solid var(--accent);
      display: inline-block;
      padding-bottom: 6px;
      font-family:"Noto Serif JP", serif;
    }

    .contact-section, .email-section {
      margin: 40px 0;
      padding: 20px;
      border-left: 4px solid var(--accent);
      background-color: rgba(255, 255, 255, 0.04);
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
      border-radius: 8px;
    }

    .contact-section a, .email-section a {
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
    }
    .contact-section a:hover, .email-section a:hover {
      text-decoration: underline;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: -10;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <!-- 統一ナビ -->
  <nav>
    <div class="nav-inner">
      <div class="brand">
        <div class="brand-badge">∑</div>
        <div>京都府立医科大学 数学研究部</div>
      </div>
      <div class="nav-links" role="navigation" aria-label="Main">
        <a href="index.html">Home</a>
        <a href="activity.html">活動報告</a>
        <a href="schedule.html">Schedule</a>
        <a href="contact.html" class="active">Contact</a>
        <a href="#" id="openBooks">蔵書</a>
        <a href="qa.html">Q&amp;A</a>
      </div>
    </div>
  </nav>

  <div class="container">
    <h1>お問い合わせ・SNS</h1>

    <div class="contact-section">
      <h2>公式X（旧Twitter）</h2>
      <p>
        最新情報や活動報告を、京都府立医科大学 数学研究部の公式アカウントで発信しています。<br>
        ▶ <a href="https://twitter.com/kpum_mathclub" target="_blank" rel="noopener">@kpum_mathclub</a>
      </p>
    </div>

    <div class="email-section">
      <h2>メールでのお問い合わせ</h2>
      <p>
        ご質問・連絡などは以下のアドレスまでご連絡ください：<br>
        ▶ <a href="mailto:mb221010@stu.kpu-m.ac.jp">mb221010@stu.kpu-m.ac.jp</a>
      </p>
    </div>
  </div>

  <!-- 「蔵書」：Homeにモーダルがあれば開く／無ければHomeへ -->
  <script>
    (function(){
      const btn = document.getElementById('openBooks');
      if(!btn) return;
      btn.addEventListener('click', (e)=>{
        e.preventDefault();
        if (typeof window.__openBooksModal === 'function') {
          window.__openBooksModal();
        } else {
          location.href = 'index.html#books';
        }
      });
    })();
  </script>

  <!-- 背景：バウンドする球 -->
  <script>
  new p5(p => {
    const ballCount = 40;
    const balls = [];
    let isPressing = false;

    class Ball {
      constructor() {
        this.r = p.random(10, 30);
        this.x = p.random(this.r, p.windowWidth - this.r);
        this.y = p.random(this.r, p.windowHeight - this.r);
        this.vx = p.random(-1, 1);
        this.vy = p.random(-1, 1);
        this.color = p.color(p.random(150, 200), p.random(150, 200), p.random(255), 150);
      }
      move() {
        const speed = isPressing ? 3 : 1;
        this.x += this.vx * speed;
        this.y += this.vy * speed;

        // 反射
        if (this.x - this.r < 0) { this.x = this.r; this.vx *= -1; }
        if (this.x + this.r > p.width) { this.x = p.width - this.r; this.vx *= -1; }
        if (this.y - this.r < 0) { this.y = this.r; this.vy *= -1; }
        if (this.y + this.r > p.height) { this.y = p.height - this.r; this.vy *= -1; }
      }
      draw() {
        p.noStroke();
        p.fill(this.color);
        p.ellipse(this.x, this.y, this.r * 2);
      }
    }

    p.setup = () => {
      const canvas = p.createCanvas(p.windowWidth, p.windowHeight);
      canvas.position(0, 0);
      canvas.style('z-index', '-10');
      canvas.style('pointer-events', 'none');
      for (let i = 0; i < ballCount; i++) balls.push(new Ball());
      p.noStroke();
    };

    p.draw = () => {
      p.background(0); // 尾なし塗りつぶし（背景はbodyのグラデ）
      for (let ball of balls) {
        ball.move();
        ball.draw();
      }
    };

    p.windowResized = () => { p.resizeCanvas(p.windowWidth, p.windowHeight); };
    p.mousePressed = () => { isPressing = true; };
    p.mouseReleased = () => { isPressing = false; };
    p.touchStarted = () => { isPressing = true; };
    p.touchEnded = () => { isPressing = false; };
  });
  </script>
</body>
</html>
